<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>친구 퀴즈</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,sans-serif;margin:0;background:#f5f7fb;color:#172033}
main{max-width:720px;margin:0 auto;padding:24px 16px}.card{background:white;border:1px solid #dde2ea;border-radius:18px;padding:20px;margin:12px 0;box-shadow:0 4px 18px #0000000a}
h1{margin:0 0 18px}.row{display:flex;gap:10px;flex-wrap:wrap}input,select,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #ccd3df}input,select{flex:1;min-width:180px}button{cursor:pointer;background:#172033;color:white;border:0}button.secondary{background:#e9edf4;color:#172033}.option{display:block;width:100%;text-align:left;background:#f1f4f8;color:#172033;margin:8px 0}.hidden{display:none}.muted{color:#667085}.danger{color:#b42318}.score{font-weight:800}.rank{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eee}.host{background:#fff7d6}
</style>
</head>
<body>
<main>
<h1>🎯 친구 퀴즈</h1>

<section id="join" class="card">
  <h2>참가하기</h2>
  <div class="row">
    <input id="name" maxlength="16" placeholder="닉네임">
    <input id="room" maxlength="8" placeholder="방 코드">
  </div>
  <button id="joinBtn">방 참가</button>
  <button id="createBtn" class="secondary">새 방 만들기</button>
  <p id="joinMsg" class="muted"></p>
</section>

<section id="host" class="card hidden host">
  <h2>문제 출제</h2>
  <p>방 코드: <b id="roomCode"></b></p>
  <select id="qtype"><option value="mc">객관식</option><option value="text">주관식</option></select>
  <input id="qtext" placeholder="문제">
  <div id="mcEditor">
    <input id="o0" placeholder="보기 1"><input id="o1" placeholder="보기 2">
    <input id="o2" placeholder="보기 3"><input id="o3" placeholder="보기 4">
    <select id="correct"><option value="0">정답: 보기 1</option><option value="1">정답: 보기 2</option><option value="2">정답: 보기 3</option><option value="3">정답: 보기 4</option></select>
  </div>
  <div id="textEditor" class="hidden"><input id="textAnswer" placeholder="주관식 정답"></div>
  <div class="row"><input id="seconds" type="number" min="5" max="120" value="20" placeholder="제한시간(초)"><button id="startBtn">문제 시작</button></div>
</section>

<section id="game" class="card hidden">
  <p>방: <b id="gameRoom"></b> · 내 점수: <span id="myScore" class="score">0</span></p>
  <h2 id="gameQ">대기 중...</h2>
  <div id="gameAnswers"></div>
  <p id="timer" class="muted"></p>
  <button id="submitText" class="hidden">정답 제출</button>
</section>

<section id="rank" class="card hidden">
  <h2>🏆 현재 순위</h2>
  <div id="ranking"></div>
</section>

<section id="players" class="card hidden">
  <h2>참가자</h2><div id="playerList"></div>
</section>
</main>

<script type="module">
/*
  1) Firebase 콘솔에서 Web App을 만든 뒤 아래 firebaseConfig를 넣으세요.
  2) Realtime Database를 만들고 README의 규칙을 적용하세요.
*/
const firebaseConfig = {
  apiKey: "AIzaSyBHMUrSE3Cr7S-Gv2orbQd2j1tlT3QMPJw",
  authDomain: "asdfasdfasdf1234.firebaseapp.com",
  databaseURL: "https://asdfasdfasdf1234-default-rtdb.firebaseio.com",
  projectId: "asdfasdfasdf1234",
  storageBucket: "asdfasdfasdf1234.firebasestorage.app",
  messagingSenderId: "1027793683299",
  appId: "1:1027793683299:web:a3731db466154271ea4956",
  measurementId: "G-491TD4MRVF"
};

import {initializeApp} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import {getDatabase, ref, set, update, get, onValue, push, remove} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";

const app=initializeApp(firebaseConfig), db=getDatabase(app);
const $=id=>document.getElementById(id);
let me=null, roomCode=null, isHost=false, current=null, answered=false, timer=null;

function show(id,on=true){$(id).classList.toggle("hidden",!on)}
function clean(s){return String(s||"").trim()}
function code(){return Math.random().toString(36).slice(2,8).toUpperCase()}
function points(n,rank){
  // 참가자 수가 많을수록 총점이 커지고, 선착순 차이가 커짐.
  const base=100+Math.max(0,n-1)*40;
  return Math.max(20, Math.round(base*(1-(rank-1)/(Math.max(1,n))*0.65)));
}
function playersObj(v){return v?.players||{}}

async function createRoom(){
  const name=clean($("name").value); if(!name){$("joinMsg").textContent="닉네임을 입력하세요.";return}
  roomCode=code(); isHost=true; me="p_"+Math.random().toString(36).slice(2,10);
  await set(ref(db,"rooms/"+roomCode),{host:me,question:null,players:{[me]:{name,score:0}}});
  enterRoom();
}
async function joinRoom(){
  const name=clean($("name").value), rc=clean($("room").value).toUpperCase();
  if(!name||!rc){$("joinMsg").textContent="닉네임과 방 코드를 입력하세요.";return}
  const snap=await get(ref(db,"rooms/"+rc));
  if(!snap.exists()){ $("joinMsg").textContent="방을 찾을 수 없습니다.";return }
  roomCode=rc;isHost=false;me="p_"+Math.random().toString(36).slice(2,10);
  await update(ref(db,"rooms/"+rc+"/players/"+me),{name,score:0});
  enterRoom();
}
function enterRoom(){
  show("join",false);show("game");show("rank");show("players");
  $("gameRoom").textContent=roomCode;
  if(isHost){show("host");$("roomCode").textContent=roomCode}
  onValue(ref(db,"rooms/"+roomCode),snap=>{const r=snap.val();if(!r)return;renderPlayers(r.players);renderQuestion(r.question,r.players);});
}
function renderPlayers(ps){
  const arr=Object.entries(ps||{}).sort((a,b)=>(b[1].score||0)-(a[1].score||0));
  $("playerList").innerHTML=arr.map(([id,p])=>`<div class="rank"><span>${p.name}${id===me?" (나)":""}</span><span class="score">${p.score||0}</span></div>`).join("");
  $("ranking").innerHTML=arr.map(([id,p],i)=>`<div class="rank"><span>${i+1}위 ${p.name}</span><span class="score">${p.score||0}점</span></div>`).join("");
  const mine=ps?.[me]; if(mine)$("myScore").textContent=mine.score||0;
}
function renderQuestion(q,ps){
  if(!q){$("gameQ").textContent=isHost?"위에서 문제를 만들어 시작하세요.":"방장이 문제를 시작할 때까지 기다리세요.";$("gameAnswers").innerHTML="";return}
  if(q.id===current?.id)return;
  current=q;answered=false;clearInterval(timer);
  $("gameQ").textContent=q.text; $("timer").textContent="남은 시간: "+q.seconds+"초";
  $("gameAnswers").innerHTML="";
  if(q.type==="mc"){
    q.options.forEach((x,i)=>{const b=document.createElement("button");b.className="option";b.textContent=x;b.onclick=()=>submitAnswer(i);$("gameAnswers").appendChild(b)});
    $("submitText").classList.add("hidden");
  }else{
    const input=document.createElement("input");input.id="answerInput";input.placeholder="정답 입력";$("gameAnswers").appendChild(input);
    $("submitText").classList.remove("hidden");$("submitText").onclick=()=>submitAnswer(clean(input.value));
  }
  let left=q.seconds;timer=setInterval(()=>{left--; $("timer").textContent="남은 시간: "+Math.max(0,left)+"초";if(left<=0)clearInterval(timer)},1000);
}
async function submitAnswer(answer){
  if(answered||!current)return; answered=true;
  const snap=await get(ref(db,"rooms/"+roomCode));const r=snap.val();const q=r.question;if(!q||q.id!==current.id)return;
  const correct=q.type==="mc"?Number(answer)===Number(q.correct):clean(answer).toLowerCase()===clean(q.answer).toLowerCase();
  if(!correct){$("timer").textContent="오답입니다.";return}
  const submissions=Object.values(q.submissions||{}).sort((a,b)=>a.time-b.time);
  if(submissions.some(x=>x.player===me))return;
  const rank=submissions.length+1, n=Math.max(1,Object.keys(r.players||{}).length);
  const pts=points(n,rank);
  await update(ref(db,`rooms/${roomCode}/question/submissions/${me}`),{player:me,time:Date.now(),rank,points:pts});
  await update(ref(db,`rooms/${roomCode}/players/${me}`),{score:(r.players?.[me]?.score||0)+pts});
  $("timer").textContent=`정답! ${rank}등 +${pts}점`;
}
$("createBtn").onclick=createRoom;$("joinBtn").onclick=joinRoom;
$("qtype").onchange=()=>{$("mcEditor").classList.toggle("hidden",$("qtype").value!=="mc");$("textEditor").classList.toggle("hidden",$("qtype").value!=="text")};
$("startBtn").onclick=async()=>{
  const text=clean($("qtext").value),type=$("qtype").value,seconds=Math.min(120,Math.max(5,Number($("seconds").value)||20));
  if(!text)return alert("문제를 입력하세요.");
  const q={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),text,type,seconds,submissions:{}};
  if(type==="mc"){q.options=[0,1,2,3].map(i=>clean($("o"+i).value));if(q.options.some(x=>!x))return alert("보기를 모두 입력하세요.");q.correct=Number($("correct").value)}
  else{q.answer=clean($("textAnswer").value);if(!q.answer)return alert("주관식 정답을 입력하세요.")}
  await set(ref(db,"rooms/"+roomCode+"/question"),q);
};
</script>
</body>
</html>
